<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 换 logo 后的效果 1:1 还原（1rpx=0.5px） */
*{box-sizing:border-box}
body{margin:0;background:#e9ecf1;font-family:"Microsoft YaHei",sans-serif;width:375px}
.screen{width:375px;position:relative;overflow:hidden;margin-bottom:22px}
.cap{font-size:11px;color:#8c98ab;padding:8px 14px 4px}

/* ---------- 启动页 ---------- */
.splash{height:667px;background:linear-gradient(160deg,#1f58e8 0%,#1a73e8 45%,#3f93ff 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(30px)}
.glow-1{width:260px;height:260px;background:rgba(255,255,255,.22);top:-60px;right:-60px}
.glow-2{width:230px;height:230px;background:rgba(120,180,255,.35);bottom:-50px;left:-70px}
.center{display:flex;flex-direction:column;align-items:center;z-index:2}
.logo{width:88px;height:88px;border-radius:23px;background:#fff;padding:8px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo-img{width:100%;height:100%;display:block;border-radius:16px}
.title{font-size:23px;font-weight:700;color:#fff;letter-spacing:1px;margin-top:22px}
.slogan{font-size:13px;color:rgba(255,255,255,.82);margin-top:7px}
.dots{display:flex;margin-top:26px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);margin:0 5px}
.dot.d1{opacity:.75}.dot.d2{opacity:.5}.dot.d3{opacity:.3}
.foot{position:absolute;bottom:54px}
.foot-t{font-size:11px;color:rgba(255,255,255,.55)}
.skip-hint{position:absolute;bottom:24px;font-size:11px;color:rgba(255,255,255,.45)}

/* ---------- 「我的」页头 ---------- */
.hero{background:linear-gradient(160deg,#2b7cf0 0%,#1a73e8 55%,#4a9bff 100%);padding:40px 0 80px}
.brand{display:flex;flex-direction:column;align-items:center}
.brand-logo{width:59px;height:59px;border-radius:17px;background:#fff;padding:6px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(12,46,110,.18);margin-bottom:11px}
.brand-logo-img{width:100%;height:100%;display:block;border-radius:12px}
.brand-name{color:#fff;font-size:20px;font-weight:600;letter-spacing:1px}
.brand-slogan{color:rgba(255,255,255,.8);font-size:12px;margin-top:5px}
</style></head><body>

<!-- ① 启动页 -->
<div class="cap">① 启动页（原来是一顶纯 CSS 画的学士帽）</div>
<div class="screen">
  <div class="splash">
    <div class="glow glow-1"></div><div class="glow glow-2"></div>
    <div class="center">
      <div class="logo"><img class="logo-img" src="../miniprogram/images/logo.png"></div>
      <div class="title">校园助手</div>
      <div class="slogan">你的校园 AI 伙伴</div>
      <div class="dots"><div class="dot d0"></div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div></div>
    </div>
    <div class="foot"><span class="foot-t">校园服务智能体 · 参赛作品</span></div>
    <div class="skip-hint">轻触跳过</div>
  </div>
</div>

<!-- ② 我的页头 -->
<div class="cap">②「我的」页头（原来是 🎓 这个 emoji）</div>
<div class="screen">
  <div class="hero">
    <div class="brand">
      <div class="brand-logo"><img class="brand-logo-img" src="../miniprogram/images/logo.png"></div>
      <div class="brand-name">校园助手</div>
      <div class="brand-slogan">你的校园 AI 伙伴</div>
    </div>
  </div>
  <div style="height:60px;background:#f5f6f8"></div>
</div>

</body></html>
