<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 输入区(能力入口 + 快捷提问 + 输入条) 1:1 还原(1rpx=0.5px) */
body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;width:375px}
.wrap{padding:10px 0;box-sizing:border-box}
.cap-bar{display:flex;padding:7px 8px 2px;background:#f5f6f8}
.cap-chip{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:7px;
  padding:7px 0;margin-right:6px;border:0.5px solid #e6ebf3;box-shadow:0 1px 4px rgba(24,39,75,.04)}
.cap-chip:last-child{margin-right:0}
.cap-dot{width:6px;height:6px;border-radius:50%;margin-right:5px;flex-shrink:0}
.cap-dot.qa{background:#1a73e8}.cap-dot.doc{background:#10b981}
.cap-dot.schedule{background:#ff8a00}.cap-dot.study{background:#7c3aed}
.cap-t{font-size:12.5px;color:#3d4a63}
.quick-bar{white-space:nowrap;padding:6px 8px;background:#f5f6f8;overflow:hidden}
.quick-chip{display:inline-block;font-size:13px;color:#1a73e8;background:#fff;border:0.5px solid #d4e2fc;
  padding:5px 11px;border-radius:15px;margin-right:7px}
.input-bar{display:flex;align-items:center;padding:8px 12px;background:#fff;border-top:0.5px solid #eee}
.input{flex:1;background:#f0f1f3;border-radius:18px;padding:9px 14px;font-size:15px;color:#999}
.send-btn{margin-left:8px;background:#1a73e8;color:#fff;font-size:14px;border-radius:18px;padding:0 18px;line-height:36px}
</style></head><body><div class="wrap">
  <div class="cap-bar">
    <div class="cap-chip"><span class="cap-dot qa"></span><span class="cap-t">问制度</span></div>
    <div class="cap-chip"><span class="cap-dot doc"></span><span class="cap-t">写材料</span></div>
    <div class="cap-chip"><span class="cap-dot schedule"></span><span class="cap-t">查日程</span></div>
    <div class="cap-chip"><span class="cap-dot study"></span><span class="cap-t">刷题</span></div>
  </div>
  <div class="quick-bar">
    <span class="quick-chip">帮我算一下绩点</span><span class="quick-chip">挂科了怎么重修</span><span class="quick-chip">奖学金怎么评</span>
  </div>
  <div class="input-bar">
    <div class="input">问制度，或「帮我写一份请假条…」</div>
    <div class="send-btn">发送</div>
  </div>
</div></body></html>
