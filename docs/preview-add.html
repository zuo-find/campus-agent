<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 输入区入口改造：旧（两个手绘图标）vs 新（一个 +）1:1 还原 */
*{box-sizing:border-box}
body{margin:0;background:#e9ecf1;font-family:"Microsoft YaHei",sans-serif;width:375px}
.screen{width:375px;background:#f5f6f8}
.cap{font-size:11px;color:#8c98ab;padding:9px 14px 5px}
.cap b{color:#e5484d}
.cap b.ok{color:#0f9d63}

.input-bar{display:flex;align-items:center;padding:8px 12px;background:#fff;border-top:.5px solid #eee}
.input{flex:1;background:#f0f1f3;border-radius:18px;padding:9px 14px;font-size:15px;color:#999}
.send-btn{margin-left:8px;background:#1a73e8;color:#fff;font-size:14px;border-radius:18px;padding:0 18px;line-height:36px}

/* ---- 旧：两个手绘图标（对比用） ---- */
.cam-btn{position:relative;width:34px;height:34px;margin-right:8px;flex-shrink:0}
.cam-body{position:absolute;left:2px;bottom:3px;width:30px;height:23px;border:1.5px solid #1a73e8;border-radius:5px;
  display:flex;align-items:center;justify-content:center}
.cam-lens{width:11px;height:11px;border:1.5px solid #1a73e8;border-radius:50%}
.cam-top{position:absolute;left:10px;top:3px;width:13px;height:6px;border:1.5px solid #1a73e8;border-bottom:none;border-radius:3px 3px 0 0}
.file-btn{position:relative;width:34px;height:34px;margin-right:6px;flex-shrink:0}
.file-body{position:absolute;left:6px;top:4px;width:21px;height:26px;border:1.5px solid #1a73e8;border-radius:4px}
.file-line{position:absolute;left:11px;height:1.5px;background:#1a73e8;border-radius:1px}
.file-line.l1{top:11px;width:11px}.file-line.l2{top:16px;width:11px}.file-line.l3{top:21px;width:7px}

/* ---- 新：一个 + ---- */
.plus-btn{position:relative;width:34px;height:34px;margin-right:7px;flex-shrink:0}
.plus-bar{position:absolute;background:#5a6684;border-radius:2px}
.plus-bar.h{left:7.5px;top:16px;width:19px;height:2px}
.plus-bar.v{left:16px;top:7.5px;width:2px;height:19px}

/* ---- 「+」弹层 ---- */
.mask{background:rgba(16,24,40,.45);padding-top:150px}
.sheet{background:#fff;border-radius:14px 14px 0 0;padding:14px 16px 20px}
.sheet-h{position:relative;text-align:center;font-size:16px;font-weight:600;color:#1a2233;padding-bottom:10px}
.sheet-x{position:absolute;right:0;top:0;color:#a6b0c0;font-size:15px}
.vm-item{display:flex;align-items:center;padding:11px 0;border-bottom:.5px solid #f2f4f8}
.vm-item:last-child{border-bottom:none}
.vm-main{flex:1;min-width:0}
.vm-t{display:block;font-size:14.5px;color:#1a2233}
.vm-d{display:block;font-size:11.5px;color:#9aa6b5;margin-top:3px}
.vm-a{color:#c6d0de;font-size:17px;margin-left:6px}
.vm-tip{font-size:11px;color:#a6b0c0;line-height:1.6;margin-top:9px}
</style></head><body>

<div class="cap">旧版：两个手绘图标挤在输入框左边（<b>你说太 AI 的那个</b>）</div>
<div class="screen">
  <div class="input-bar">
    <div class="file-btn"><div class="file-line l1"></div><div class="file-line l2"></div><div class="file-line l3"></div><div class="file-body"></div></div>
    <div class="cam-btn"><div class="cam-top"></div><div class="cam-body"><div class="cam-lens"></div></div></div>
    <div class="input">问制度，或「帮我写一份请假条…」</div>
    <div class="send-btn">发送</div>
  </div>
</div>

<div class="cap">新版：一个极简「+」，按下变蓝（<b class="ok">DeepSeek 那种做法</b>）</div>
<div class="screen">
  <div class="input-bar">
    <div class="plus-btn"><div class="plus-bar h"></div><div class="plus-bar v"></div></div>
    <div class="input">问制度，或「帮我写一份请假条…」</div>
    <div class="send-btn">发送</div>
  </div>
</div>

<div class="cap">点「+」之后：才出现这两个选项</div>
<div class="screen">
  <div class="mask">
    <div class="sheet">
      <div class="sheet-h">添加什么？<span class="sheet-x">✕</span></div>
      <div class="vm-item"><div class="vm-main"><span class="vm-t">拍照或从相册选图</span><span class="vm-d">拍题、拍通知、拍成绩单，让 AI 看图</span></div><span class="vm-a">›</span></div>
      <div class="vm-item"><div class="vm-main"><span class="vm-t">上传文件</span><span class="vm-d">PDF、Word、文本，让 AI 读内容</span></div><span class="vm-a">›</span></div>
      <div class="vm-tip">上传的文件会一直跟着之后的提问，不需要时点附件栏的「全部移除」。</div>
    </div>
  </div>
</div>

</body></html>
