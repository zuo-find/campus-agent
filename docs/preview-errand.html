<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 「快递外卖」子页：1:1 还原(750rpx=375px，1rpx=0.5px) */
body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;width:375px}
.wrap{padding:20px 0;box-sizing:border-box}
.jump-card{display:flex;align-items:center;background:#fff;border-radius:10px;margin:10px 12px;padding:14px;box-shadow:0 4px 13px rgba(24,39,75,.06)}
.jump-badge{width:40px;height:40px;border-radius:12px;margin-right:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff}
.jump-badge.tone0{background:linear-gradient(135deg,#ffb020,#ff8a00)}
.jump-badge.tone1{background:linear-gradient(135deg,#4a9bff,#1a73e8)}
.jump-badge.tone2{background:linear-gradient(135deg,#34d399,#10b981)}
.jump-badge.tone3{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.jump-main{flex:1;display:flex;flex-direction:column}
.jump-title{font-size:16px;color:#1a2233;font-weight:600}
.jump-sub{font-size:12.5px;color:#9aa6b5;margin-top:4px}
.jump-arrow{font-size:22px;color:#cdd6e2}
.jump-card.ghost{box-shadow:none;border:0.5px dashed #dbe2ec;background:#fafbfd}
.jump-badge.ghost-mark{background:#eef1f6;color:#b6c0cf;font-weight:400;font-size:20px}
.jump-card.ghost .jump-title{color:#8c98ab;font-weight:500}
.tip{font-size:12px;color:#aaa;text-align:center;margin:12px}
</style></head><body><div class="wrap">
  <div class="jump-card">
    <div class="jump-badge tone0">外</div>
    <div class="jump-main"><span class="jump-title">外卖(美团)</span><span class="jump-sub">点击进入小程序</span></div>
    <span class="jump-arrow">›</span>
  </div>
  <div class="jump-card ghost">
    <div class="jump-badge ghost-mark">＋</div>
    <div class="jump-main"><span class="jump-title">快递代取 / 收寄</span><span class="jump-sub">暂未接入，可由管理员配置</span></div>
  </div>
  <div class="tip">点击卡片跳转到对应小程序。</div>
</div></body></html>
