<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 按 750rpx=375px，1rpx=0.5px，1:1 还原「失物招领」列表新样式 */
body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;width:375px}
.wrap{padding:10px 0 20px;min-height:812px;box-sizing:border-box}
.lf-head{display:flex;align-items:center;margin:10px 12px}
.seg{display:flex;background:#fff;border-radius:6px;padding:3px}
.seg.small{margin:0;flex:1}
.seg-item{flex:1;text-align:center;font-size:14px;color:#666;padding:8px 0;border-radius:5px}
.seg-item.on{background:#1a73e8;color:#fff}
.mini-btn{font-size:13px;color:#fff;background:#1a73e8;border:none;border-radius:18px;line-height:34px;padding:0 17px;margin-left:8px;box-shadow:0 4px 9px rgba(26,115,232,.26)}

.lf-card{position:relative;display:flex;background:#fff;border-radius:10px;margin:0 12px 11px;overflow:hidden;box-shadow:0 4px 13px rgba(24,39,75,.06)}
.lf-accent{width:4px;flex-shrink:0}
.lf-card.lost .lf-accent{background:linear-gradient(180deg,#ff7a7f,#ff5a5f)}
.lf-card.found .lf-accent{background:linear-gradient(180deg,#34d399,#10b981)}
.lf-body{flex:1;padding:14px 15px 12px;min-width:0}
.lf-top{display:flex;align-items:center}
.lf-badge{font-size:11px;padding:2.5px 8px;border-radius:4px;margin-right:8px;flex-shrink:0}
.lf-card.lost .lf-badge{background:#ffeceb;color:#e5484d}
.lf-card.found .lf-badge{background:#e6f8f0;color:#0f9d63}
.lf-title{flex:1;font-size:16px;font-weight:600;color:#1a2233;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lf-time{font-size:11px;color:#a6b0c0;margin-left:7px;flex-shrink:0}
.lf-meta{display:flex;font-size:13px;margin-top:6px}
.lf-k{width:34px;color:#a6b0c0;flex-shrink:0}
.lf-v{flex:1;color:#5a6684;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lf-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.lf-contact{background:#f1f5fb;border-radius:5px;padding:5px 10px;font-size:12px;color:#64708a;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lf-done{font-size:12px;color:#1a73e8;border:0.5px solid #cfe0fb;border-radius:15px;padding:4px 13px}
</style></head><body><div class="wrap">
  <div class="lf-head">
    <div class="seg small"><div class="seg-item on">我丢了</div><div class="seg-item">我捡到</div></div>
    <button class="mini-btn">＋ 发布</button>
  </div>

  <div class="lf-card lost">
    <div class="lf-accent"></div>
    <div class="lf-body">
      <div class="lf-top"><span class="lf-badge">丢失</span><span class="lf-title">黑色雨伞</span><span class="lf-time">今天 11:26</span></div>
      <div class="lf-meta"><span class="lf-k">地点</span><span class="lf-v">三教201</span></div>
      <div class="lf-meta"><span class="lf-k">备注</span><span class="lf-v">伞柄有卡通贴纸</span></div>
      <div class="lf-foot"><span class="lf-contact">微信 abc123</span><span class="lf-done">标记已解决</span></div>
    </div>
  </div>

  <div class="lf-card found">
    <div class="lf-accent"></div>
    <div class="lf-body">
      <div class="lf-top"><span class="lf-badge">捡到</span><span class="lf-title">校园卡（尾号 0328）</span><span class="lf-time">昨天 18:02</span></div>
      <div class="lf-meta"><span class="lf-k">地点</span><span class="lf-v">图书馆二楼自习区</span></div>
      <div class="lf-meta"><span class="lf-k">备注</span><span class="lf-v">已交到图书馆前台，可凭学号领取</span></div>
      <div class="lf-foot"><span class="lf-contact">手机 138****6677</span><span class="lf-done">标记已解决</span></div>
    </div>
  </div>

  <div class="lf-card lost">
    <div class="lf-accent"></div>
    <div class="lf-body">
      <div class="lf-top"><span class="lf-badge">丢失</span><span class="lf-title">AirPods 充电盒</span><span class="lf-time">3天前</span></div>
      <div class="lf-meta"><span class="lf-k">地点</span><span class="lf-v">操场看台</span></div>
      <div class="lf-foot"><span class="lf-contact">微信 zhangsan_05</span><span class="lf-done">标记已解决</span></div>
    </div>
  </div>
</div></body></html>
