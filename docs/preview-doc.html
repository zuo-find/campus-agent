<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 问答页「材料卡片」1:1 还原(1rpx=0.5px) */
body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;width:375px}
.wrap{padding:8px 0;box-sizing:border-box;min-height:560px}
.msg-row{display:flex;padding:6px 12px}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{justify-content:flex-start}
.bubble{max-width:78%;padding:10px 12px;border-radius:9px;word-break:break-all}
.bubble.user{background:#1a73e8;color:#fff}
.bubble.assistant{background:#fff;color:#222}
.bubble-text{font-size:15px;line-height:1.5;white-space:pre-wrap}
.doc-card{margin:4px 12px 10px;background:#fff;border-radius:9px;overflow:hidden;border:0.5px solid #e6ebf3;box-shadow:0 4px 12px rgba(24,39,75,.06)}
.dc-head{display:flex;align-items:center;padding:11px 12px 7px}
.dc-badge{font-size:10px;color:#1a73e8;background:#eaf1fe;border-radius:3px;padding:2px 6px;margin-right:7px}
.dc-title{flex:1;font-size:15px;font-weight:600;color:#1a2233}
.dc-preview{max-height:280px;padding:0 12px;overflow:hidden}
.dc-text{display:block;font-size:12.5px;color:#5a6684;line-height:1.7;white-space:pre-wrap;border-top:0.5px solid #f2f4f8;padding:8px 0}
.dc-btns{display:flex;padding:0 12px 12px}
.dc-btn{flex:1;text-align:center;font-size:13.5px;line-height:38px;border-radius:6px}
.dc-btn.ghost{color:#1a73e8;border:0.5px solid #cfe0fb;margin-right:10px}
.dc-btn.primary{color:#fff;background:#1a73e8}
</style></head><body><div class="wrap">
  <div class="msg-row user"><div class="bubble user"><span class="bubble-text">帮我写一份请假条，我感冒发烧了要请2天假，从11月5号开始</span></div></div>
  <div class="msg-row assistant"><div class="bubble assistant"><span class="bubble-text">好的，请假条初稿帮你写好了 👇 姓名、班级、去向、联系方式这些你没提到，我先留了空，你在页面上补一下就能导出 Word。

顺带提醒你（来源：请假管理规定_示例.txt）：请假 3 天以内找辅导员就行。</span></div></div>
  <div class="doc-card">
    <div class="dc-head"><span class="dc-badge">材料</span><span class="dc-title">请假条</span></div>
    <div class="dc-preview"><span class="dc-text">请假条

尊敬的辅导员：

    您好！我是＿＿＿＿＿＿＿＿＿＿＿＿，因感冒发烧，需自2026-11-05起请假2天。
    请假期间本人去向为＿＿＿＿＿＿，联系方式＿＿＿＿＿＿。
    恳请批准，谢谢！</span></div>
    <div class="dc-btns"><div class="dc-btn ghost">编辑字段</div><div class="dc-btn primary">导出 Word</div></div>
  </div>
</div></body></html>
