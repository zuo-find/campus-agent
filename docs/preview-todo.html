<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
/* 待办清单卡片 1:1 还原(1rpx=0.5px) */
body{margin:0;background:#f5f6f8;font-family:"Microsoft YaHei",sans-serif;width:375px}
.wrap{padding:8px 0 20px;box-sizing:border-box}
.msg-row{display:flex;padding:6px 12px}
.msg-row.user{justify-content:flex-end}
.bubble{max-width:80%;padding:10px 12px;border-radius:9px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.bubble.user{background:#1a73e8;color:#fff}
.bubble.assistant{background:#fff;color:#222}
.agent-chip{display:inline-block;font-size:10px;border-radius:3px;padding:1.5px 6px;margin-bottom:5px;color:#d97706;background:#fff5e6}
.todo-card{margin:4px 12px 10px;background:#fff;border-radius:9px;overflow:hidden;border:0.5px solid #f3e7d3;box-shadow:0 4px 12px rgba(24,39,75,.06)}
.tc-head{display:flex;align-items:center;padding:11px 12px 6px}
.tc-badge{font-size:10px;color:#d97706;background:#fff5e6;border-radius:3px;padding:2px 6px;margin-right:7px}
.tc-title{flex:1;font-size:15px;font-weight:600;color:#1a2233}
.tc-item{display:flex;align-items:center;padding:9px 12px;border-top:0.5px solid #f5f7fa}
.tc-dot{width:6px;height:6px;border-radius:50%;background:#c6d0de;margin-right:9px;flex-shrink:0}
.tc-dot.urgent{background:#ff8a00}
.tc-main{flex:1;min-width:0}
.tc-t{display:block;font-size:14px;color:#1a2233}
.tc-right{display:flex;flex-direction:column;align-items:flex-end;margin-left:8px}
.tc-due{font-size:12px;color:#5a6684}
.tc-days{font-size:11px;color:#a6b0c0;margin-top:2px}
.tc-days.urgent{color:#ff8a00;font-weight:600}
</style></head><body><div class="wrap">
  <div class="msg-row user"><div class="bubble user">这次院内挑战赛什么时候报名、什么时候交作品？帮我把关键时间点整理成待办</div></div>
  <div class="msg-row assistant"><div class="bubble assistant"><span class="agent-chip">日程提醒</span>电子信息工程学院第二届计算机综合实践挑战赛关键时间点已整理，今天是 2026年10月13日。报名 10月26日开放，距今 13 天，是当前最近的节点。</div></div>
  <div class="todo-card">
    <div class="tc-head"><span class="tc-badge">待办</span><span class="tc-title">关键时间点</span></div>
    <div class="tc-item"><span class="tc-dot urgent"></span><div class="tc-main"><span class="tc-t">扫码报名（每赛道单独填报）</span></div><div class="tc-right"><span class="tc-due">10月26日</span><span class="tc-days urgent">还有13天</span></div></div>
    <div class="tc-item"><span class="tc-dot"></span><div class="tc-main"><span class="tc-t">赛前训练营</span></div><div class="tc-right"><span class="tc-due">11月16日</span><span class="tc-days">还有34天</span></div></div>
    <div class="tc-item"><span class="tc-dot"></span><div class="tc-main"><span class="tc-t">T3、T4、T6 作品提交截止</span></div><div class="tc-right"><span class="tc-due">11月30日</span><span class="tc-days">还有48天</span></div></div>
    <div class="tc-item"><span class="tc-dot"></span><div class="tc-main"><span class="tc-t">T3、T4、T6 作品答辩路演</span></div><div class="tc-right"><span class="tc-due">12月10日</span><span class="tc-days">还有58天</span></div></div>
    <div class="tc-item"><span class="tc-dot"></span><div class="tc-main"><span class="tc-t">颁奖典礼暨授旗仪式（暂定）</span></div><div class="tc-right"><span class="tc-due">12月18日</span><span class="tc-days">还有66天</span></div></div>
  </div>
</div></body></html>
